<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saras träd-app</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Träd-app">
<meta name="theme-color" content="#1d4a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e7ece3; --surface:#f7f9f4; --paper:#fbfcf8; --ink:#17301f; --muted:#56685a; --line:#cdd6c9;
  --spruce:#1d4a33; --spruce-ink:#ffffff; --ok:#2c7a43; --bad:#b4391f; --gold:#b98a14;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101713; --surface:#18221c; --paper:#e3e8de; --ink:#e2eae0; --muted:#9aab9c; --line:#2b3a30;
    --spruce:#93d1a3; --spruce-ink:#0e2317; --ok:#72c58b; --bad:#f08263; --gold:#e2b64c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#18221c; --paper:#e3e8de; --ink:#e2eae0; --muted:#9aab9c; --line:#2b3a30;
  --spruce:#93d1a3; --spruce-ink:#0e2317; --ok:#72c58b; --bad:#f08263; --gold:#e2b64c; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
main{max-width:560px;margin:0 auto;padding:18px 18px 112px}
svg.art{width:100%;height:100%;display:block}

/* home */
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--spruce);color:var(--spruce-ink)}
.about{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.about summary{font-weight:600;cursor:pointer}
.about p{margin:8px 0 2px;color:var(--muted)}
.toxtag{display:inline-block;font:600 .72rem/1.5 var(--sans);color:#fff;background:var(--bad);border-radius:6px;padding:0 6px;margin-left:2px;vertical-align:1px}
.nm .toxtag{margin:3px 0 0}
.warnbox{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-left:4px solid var(--bad);border-radius:4px 14px 14px 4px;padding:12px 16px;margin:22px 0 0}
.warnbox h2{font:600 .85rem/1.3 var(--sans);color:var(--bad);margin:0 0 2px}
.warnbox p{margin:0}
.toxline{color:var(--bad);font-weight:500}
.plate.pp{grid-template-columns:1fr 1fr}
.svn{font-weight:400;color:var(--muted);font-size:.82em}
.label h1 .svn{display:block;font-size:.6em;line-height:1.3;margin-top:2px}
.brand{font:600 2.5rem/1.02 var(--serif);letter-spacing:-.015em;margin:4px 0 8px}
.lede{color:var(--muted);margin:0 0 18px;max-width:36ch}
.herb{background:var(--paper);border-radius:20px;padding:12px 10px 10px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px 2px;box-shadow:inset 0 0 0 1px rgba(30,60,40,.08)}
.sil{appearance:none;border:0;background:none;padding:2px;height:48px;border-radius:8px;display:block;min-width:0}
.sil svg{filter:brightness(0) invert(80%);opacity:.9}
.sil.on svg{filter:none;opacity:1}
.herbcap{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin:8px 4px 22px}
.primary,.secondary{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;border-radius:16px;padding:14px 18px;font-weight:600;font-size:1.05rem;text-align:left;text-decoration:none}
.primary{background:var(--spruce);color:var(--spruce-ink)}
.secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.primary small,.secondary small{font-weight:400;font-size:.88rem;opacity:.82}
.wide{width:100%}
.level{margin-top:34px}
.lvhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.lvhead h2{font:600 1.4rem/1.2 var(--serif);margin:0}
.lvhead p{margin:0;color:var(--muted);font-size:.9rem;flex:1;min-width:12ch}
.lvhead .count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0}
.row{width:100%;display:grid;grid-template-columns:24px 58px 1fr auto;align-items:center;gap:12px;padding:10px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;text-align:right}
.tile{width:58px;height:58px;border-radius:12px;background:var(--paper);padding:5px;display:block}
.nm{min-width:0}
.nm b{display:block;font:600 1.12rem/1.2 var(--serif)}
.nm i{display:block;color:var(--muted);font:italic 400 .86rem/1.3 var(--serif)}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.st em{font-style:normal;font-size:.78rem;color:var(--muted)}
.st.known em{color:var(--ok);font-weight:600}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.st.known .dots i{background:var(--ok)}
.foot{margin-top:36px;text-align:center}
.textbtn{background:none;border:0;color:var(--muted);font-size:.9rem;text-decoration:underline;text-underline-offset:3px;padding:8px}
.textbtn.warn{color:var(--bad)}
.dedication{margin:30px 0 4px;text-align:center;font:italic 400 1.05rem/1.6 var(--serif);color:var(--muted)}

/* detail */
.bar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.back{background:none;border:0;padding:8px 0;font-weight:600;color:var(--spruce)}
.back::before{content:'‹';font-size:1.4em;line-height:0;margin-right:6px;position:relative;top:.06em}
.plate{margin:0;background:var(--paper);border-radius:24px;display:grid;grid-template-columns:1.55fr 1fr;overflow:hidden}
.plate>div{position:relative;padding:30px 10px 12px;min-width:0}
.plate figcaption{position:absolute;top:10px;left:14px;font-size:.78rem;font-weight:600;color:#5d6e60}
.pt{border-right:1px dashed rgba(40,70,50,.2)}
.pt .pa,.ps .pa{height:min(62vw,280px)}
.pl{grid-column:1/3;border-top:1px dashed rgba(40,70,50,.2);padding-bottom:40px!important}
.pl .pa{height:min(56vw,250px)}
.label{position:relative;margin:-36px 14px 0 auto;width:fit-content;max-width:85%;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 16px 12px;box-shadow:0 2px 0 var(--line)}
.label .lnum{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.label h1{font:600 2rem/1.1 var(--serif);margin:0}
.label .latin{font:italic 400 1rem/1.3 var(--serif);margin:2px 0 4px}
.label .rar{font-size:.85rem;color:var(--muted);margin:0}
.memo{background:color-mix(in srgb,var(--gold) 13%,var(--surface));border-left:4px solid var(--gold);border-radius:4px 14px 14px 4px;padding:12px 16px;margin:22px 0 8px}
.memo h2{font:600 .85rem/1.3 var(--sans);color:var(--muted);margin:0 0 2px}
.memo p{margin:0;font:400 1.08rem/1.45 var(--serif)}
.facts{margin:0}
.facts>div{padding:13px 0;border-bottom:1px solid var(--line)}
.facts dt{font-weight:600;font-size:.88rem;color:var(--muted)}
.facts dd{margin:2px 0 0}
.facts dd::after{content:'';display:block;clear:both}
.swatch{float:right;width:104px;height:64px;border-radius:10px;overflow:hidden;margin:2px 0 6px 14px}
.swatch svg{width:100%;height:100%;display:block}
.sub{font:600 1.15rem/1.3 var(--serif);margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:4px 14px 4px 4px;font-weight:600}
.chip .ct{width:34px;height:34px;border-radius:50%;background:var(--paper);padding:3px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.links a{display:block;text-align:center;padding:12px 6px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:none;font-weight:600;font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.actions{margin-top:26px;display:grid;gap:10px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.pn button{background:none;border:0;padding:10px 0;color:var(--muted);font-weight:500;text-align:left;max-width:48%}
.pn button:last-child{text-align:right;margin-left:auto}
.pn b{display:block;color:var(--ink);font:600 1.02rem var(--serif)}

/* quiz */
.qintro{color:var(--muted);margin:0 0 18px}
.sets{display:grid;gap:10px}
.set{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;width:100%;text-align:left;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:14px 16px}
.set b{font:600 1.15rem/1.2 var(--serif)}
.set span{color:var(--muted);font-size:.9rem;grid-column:1}
.set .meter{grid-column:2;grid-row:1/3;width:54px;height:54px}
.set.sugg{box-shadow:inset 0 0 0 2px var(--spruce)}
.set .tag{grid-column:1;color:var(--spruce);font-weight:600;font-size:.82rem}
.qtop{display:flex;justify-content:space-between;align-items:center}
.qcount{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.qbar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 18px}
.qbar span{display:block;height:100%;background:var(--spruce);border-radius:9px;transition:width .3s}
.qprompt{font:600 1.45rem/1.25 var(--serif);margin:0 0 12px}
.qmedia{background:var(--paper);border-radius:22px;height:min(64vw,290px);padding:16px;margin:0 0 16px}
.qmedia.bk{padding:0;overflow:hidden}
.qmedia.bk svg{width:100%;height:100%;display:block}
.clue{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:18px;padding:16px 18px;margin:0 0 16px}
.clue span{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.clue p{margin:0;font:400 1.15rem/1.45 var(--serif)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:60px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:1.04rem;padding:10px;transition:background-color .15s,box-shadow .15s,opacity .15s}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{box-shadow:inset 0 0 0 2.5px var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.wrong{box-shadow:inset 0 0 0 2.5px var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.opt.dim{opacity:.5}
.opts.pics .opt{height:150px;background:var(--paper);padding:12px}
.opts.pics .opt.right{background:var(--paper)}
.opts.pics .opt.wrong{background:var(--paper)}
.fb{margin-top:18px}
.fb .res{font:600 1.25rem/1.3 var(--serif);margin:0 0 6px}
.fb .res.ok{color:var(--ok)}
.fb .res.no{color:var(--bad)}
.fb .why{margin:0 0 6px}
.fbstrip{display:grid;grid-template-columns:1.3fr .8fr 1.3fr;gap:4px;background:var(--paper);border-radius:14px;padding:8px;height:110px;margin:6px 0 10px}
.fbstrip span{display:block;min-width:0;height:94px}
.tstat{font-size:.88rem;color:var(--muted)}
.tstat.known{color:var(--ok);font-weight:600}
.fb .learned{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,var(--surface));font-weight:600}
.fb .primary{margin-top:16px}
.score{font:600 3rem/1 var(--serif);margin:14px 0 6px}
.scorep{color:var(--muted);margin:0 0 6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:220px;border:0;background:none;border-radius:12px;padding:11px 8px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@media (min-width:600px){ main{padding-top:34px} .brand{font-size:3rem} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div id="sprite"></div>
<main id="app"></main>
<nav id="tabs" class="tabs" aria-label="Huvudmeny"><button data-go="home">Träd</button><button data-go="quiz">Öva</button></nav>
<script>
const TreeArt = (() => {
  const PI = Math.PI;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const frac = x => x - Math.floor(x);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const f = n => Math.round(n * 10) / 10;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
  function mix(a, b, t) { const c = rgb(a), d = rgb(b); return '#' + c.map((v, i) => Math.round(v + (d[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
  const dk = (h, t) => mix(h, '#0d1a10', t), lt = (h, t) => mix(h, '#ffffff', t);
  const path = pts => 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
  const tf = (p, tx, ty, ang, sc) => { const c = Math.cos(ang), s = Math.sin(ang); const x = p[0] * sc, y = p[1] * sc; return [tx + x * c - y * s, ty + x * s + y * c]; };

  class Sheet {
    constructor() { this.els = []; this.pts = []; }
    add(svg, pts) { this.els.push(svg); if (pts) for (const p of pts) this.pts.push(p); }
    box(x, y, r) { this.pts.push([x - r, y - r], [x + r, y + r]); }
    build(rotDeg = 0, pad = 8) {
      const a = rotDeg * PI / 180; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const p of this.pts) { const q = tf(p, 0, 0, a, 1); x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
      const vb = `${f(x0 - pad)} ${f(y0 - pad)} ${f(x1 - x0 + pad * 2)} ${f(y1 - y0 + pad * 2)}`;
      return { vb, inner: `<g transform="rotate(${rotDeg})" stroke-linecap="round" stroke-linejoin="round">${this.els.join('')}</g>` };
    }
  }

  let LO = false;
  /* ---------- simple leaf ---------- */
  function leafShape(o) {
    const L = o.L, W = o.W, a = o.a ?? 1, bB = o.bB ?? 0.8, bT = o.bT ?? 0.8, N = LO ? Math.min(o.N ?? 340, o.loN ?? 64) : (o.N ?? 340);
    const peak = Math.pow(0.5, 1 / a);
    const width = t => {
      t = clamp(t, 0, 1);
      let w = Math.pow(Math.max(Math.sin(PI * Math.pow(t, a)), 0), t < peak ? bB : bT);
      if (o.acum) w *= 1 - o.acum * sstep(0.5, 0.97, t);
      if (o.ears) w += o.ears * Math.exp(-Math.pow((t - 0.05) / 0.035, 2));
      if (o.lobes && t > 0.03 && t < 0.985) {
        const D = o.lobeD * (o.lobeFade ? Math.max(0, 1 - t * o.lobeFade) : 1);
        const s = Math.abs(Math.sin(PI * o.lobes * (t - 0.03) / 0.955));
        w *= (1 - D) + D * Math.pow(s, o.lobeP ?? 0.6);
      }
      return w;
    };
    const tooth = t => {
      if (!o.teeth) return 0;
      const st = o.teethFrom ?? 0.05;
      const env = Math.pow(Math.sin(PI * t), 0.45) * sstep(st, st + 0.12, t) * sstep(0.995, 0.93, t);
      let d = 0;
      for (const k of o.teeth) {
        const u = t * k.n + (k.ph || 0);
        if (k.kind === 'wave') d += k.amp * Math.sin(2 * PI * u);
        else if (k.kind === 'spine') d += k.amp * (Math.pow(frac(u), 3.2) - 0.2);
        else d += k.amp * Math.pow(frac(u), 1.8);
      }
      return d * env;
    };
    const smooth = { 1: [], '-1': [] };
    const side = sg => {
      const skew = sg > 0 ? (o.skew || 0) : 0, sc = sg > 0 ? (o.asym || 1) : 1, pts = [];
      for (let i = 0; i <= N; i++) {
        const t0 = i / N, t = skew + (1 - skew) * t0;
        const w0 = W * sc * width(t0);
        let y = -L * t;
        if (o.cord) { const cw = o.cordW ?? 0.3; if (t0 < cw) y += o.cord * L * Math.sin(PI * t0 / cw); }
        if (o.notch) y += o.notch * L * Math.exp(-Math.pow((1 - t0) / 0.07, 2));
        smooth[sg].push([sg * w0, y]);
        pts.push([sg * Math.max(w0 + tooth(t0), 0), y]);
      }
      return pts;
    };
    const R = side(1), Lf = side(-1);
    const outline = R.concat(Lf.slice().reverse());
    const tipY = R[R.length - 1][1];
    const veins = [`M0 0 L0 ${f(tipY * 0.96)}`];
    const n = o.veins ?? 7;
    for (const s of [1, -1]) {
      const skew = s > 0 ? (o.skew || 0) : 0, sm = smooth[s];
      for (let k = 0; k < n; k++) {
        const t0 = (o.veinStart ?? 0.1) + (k + (s < 0 ? 0.3 : 0)) * ((0.84 - (o.veinStart ?? 0.1)) / n);
        if (t0 > 0.86) continue;
        const reach = o.veinArc ? 0.26 : (o.veinReach ?? 0.13);
        const te = Math.min(t0 + reach, 0.96);
        const e = sm[Math.round(te * N)], m = sm[Math.round((t0 + reach * 0.35) * N)];
        const y0 = -L * (skew + (1 - skew) * t0);
        const xe = e[0] * 0.86, ye = e[1];
        const cx = m[0] * (o.veinArc ? 0.75 : 0.45), cy = (y0 + ye) / 2 + (o.veinArc ? 4 : 2);
        veins.push(`M0 ${f(y0)} Q${f(cx)} ${f(cy)} ${f(xe)} ${f(ye)}`);
      }
      if (o.baseVeins) {
        const e = sm[Math.round(0.2 * N)], m = sm[Math.round(0.08 * N)];
        veins.push(`M0 ${f(-L * skew * 0.5)} Q${f(m[0] * 0.6)} ${f(m[1] + 2)} ${f(e[0] * 0.85)} ${f(e[1])}`);
      }
    }
    if (o.baseNerves) for (let k = 1; k <= o.baseNerves; k++) for (const sd of [1, -1]) { const fr = k / (o.baseNerves + 0.5), m = smooth[sd][Math.round(0.42 * N)]; veins.push(`M0 0 Q${f(m[0] * fr * 1.25)} ${f(m[1])} 0 ${f(tipY * 0.97)}`); }
    return { outline, veins, tipY };
  }

  function drawLeaf(sh, shape, c, tx = 0, ty = 0, ang = 0, sc = 1, opt = {}) {
    const pts = shape.outline.map(p => tf(p, tx, ty, ang, sc));
    const deg = ang * 180 / PI;
    const vw = opt.vein ?? 1.1;
    let g = `<g transform="translate(${f(tx)} ${f(ty)}) rotate(${f(deg)}) scale(${sc})">`;

  /* ---------- state ---------- */
  function fresh() { const t = {}; ALL.forEach(x => t[x.id] = { s: 0, r: 0, w: 0, k: false }); return { v: 1, ep: EPOCH, t, at: 0 }; }
  function normalize(d) {

    if (!d || typeof d !== 'object' || !d.t || d.ep !== EPOCH) return base;
    for (const id of ids) { const x = d.t[id]; if (x) base.t[id] = { s: +x.s || 0, r: +x.r || 0, w: +x.w || 0, k: !!x.k }; }
    base.at = +d.at || 0; return base;
  }
  let S = fresh();

    if (writing) { pending = true; return; }

  }

  /* ---------- quiz ---------- */
  function distractors(t, pool) {
    const out = [];
    const add = id => { if (id !== t.id && !out.includes(id) && byId[id] && byId[id].g === t.g) out.push(id); };
    shuffle(t.conf).slice(0, 2).forEach(add);
    shuffle(pool.map(p => p.id)).forEach(id => out.length < 3 && add(id));
    const list = plant(t) ? PLANTS : TREES;
    shuffle(list.filter(x => x.lv === t.lv).map(x => x.id)).forEach(id => out.length < 3 && add(id));
    shuffle(list.map(x => x.id)).forEach(id => out.length < 3 && add(id));
    return out.slice(0, 3);
  }
  function typesFor(t, reps) {
    if (plant(t)) {
      const vis = shuffle(['flower', 'leaf', 'habit']);
      const rest = shuffle([vis[1], vis[2], 'clue', 'pick']);
      return reps === 1 ? [shuffle(['flower', 'leaf', 'habit', 'clue', 'pick'])[0]] : [vis[0], ...rest].slice(0, reps);
    }
    const first = HABQ.has(t.id) && Math.random() < 0.4 ? 'habit' : 'leaf';
    let rest = ['clue', 'pick'];
    if (STAMQ.has(t.id)) rest.push('stam');
    if (first === 'habit') rest.push('leaf'); else if (HABQ.has(t.id)) rest.push('habit');
    rest = shuffle(rest);
    return reps === 1 ? shuffle([first, ...rest]).slice(0, 1) : [first, ...rest].slice(0, reps);
  }
  function makeQuestion(t, type, pool) {
    const opts = shuffle([t.id, ...distractors(t, pool)]);
    const fld = type === 'clue' ? shuffle(plant(t) ? ['leaf', 'flower', 'flower', 'form', 'use'] : ['leaf', 'leaf', 'bark', 'fruit', 'form'])[0] : null;
    return { id: t.id, type, opts, fld };
  }
  function startQuiz(key) {
    const pool = setItems(key);
    if (!pool.length) { view = { name: 'quiz' }; Q = null; render(); return; }
    const reps = REPS(key);
    const plan = Object.fromEntries(pool.map(t => [t.id, typesFor(t, reps)]));
    const items = []; let last = null;
    for (let r = 0; r < reps; r++) {
      const order = shuffle(pool);
      if (order.length > 1 && order[0].id === last) { const z = order.length - 1; [order[0], order[z]] = [order[z], order[0]]; }
      for (const t of order) items.push(makeQuestion(t, plan[t.id][r], pool));
      last = order[order.length - 1].id;
    }
    Q = { key, mode: MODE, items, i: 0, score: 0, picked: null, missed: [], learned: [] };
    view = { name: 'quiz' }; render(true);
  }
  function questionView() {
    const q = Q.items[Q.i], t = byId[q.id], done = Q.picked !== null, u = U(), m = plant(t) ? 'vaxt' : 'trad', P = u.q[m];
    const N = Q.items.length;
    let prompt, media = '';
    if (q.type === 'leaf') { prompt = P.leaf(t.g); media = `<div class="qmedia">${A('a', q.id)}</div>`; }
    else if (q.type === 'habit') { prompt = P.habit(t.g); media = `<div class="qmedia">${A('h', q.id)}</div>`; }
    else if (q.type === 'stam') { prompt = P.stam; media = `<div class="qmedia">${A('t', q.id)}</div>`; }
    else if (q.type === 'flower') { prompt = P.flower; media = `<div class="qmedia">${A('f', q.id)}</div>`; }
    else if (q.type === 'clue') { prompt = P.clue; media = `<div class="clue"><span>${fieldLabel(t, q.fld)}</span><p>${tx(t, q.fld)}</p></div>`; }
    else { prompt = u.qPick(nameS(t)); }
    const cls = id => !done ? '' : id === q.id ? 'right' : id === Q.picked ? 'wrong' : 'dim';
    const opts = q.type === 'pick'
      ? `<div class="opts pics">${q.opts.map((id, i) => `<button class="opt ${cls(id)}" data-ans="${i}" ${done ? 'disabled' : ''} aria-label="${u.opt} ${i + 1}${done ? ', ' + nameH(byId[id]) : ''}">${A(tileKind(byId[id]), id)}</button>`).join('')}</div>`
      : `<div class="opts">${q.opts.map((id, i) => `<button class="opt ${cls(id)}" data-ans="${i}" ${done ? 'disabled' : ''}>${nameH(byId[id])}</button>`).join('')}</div>`;
    let fb = '';
    if (done) {
      const ok = Q.picked === q.id;
      fb = `<p class="res ${ok ? 'ok' : 'no'}">${ok ? u.right(nameS(t)) : u.wrong(nameS(t))}</p>`;
      if (!ok && q.type === 'pick') fb += `<p class="why">${u.picked(nameS(byId[Q.picked]))}</p>`;
      fb += `<div class="fbstrip" aria-hidden="true"><span>${A('h', q.id)}</span><span>${A(plant(t) ? 'f' : 't', q.id)}</span><span>${A('a', q.id)}</span></div><p class="why">${tx(t, 'memo')}</p>`;
      if (t.warn) fb += `<p class="why toxline">${u.warn}: ${tx(t, 'warn')}</p>`;
      if (Q.justLearned) fb += `<p class="learned">${u.nowLearned(nameH(t))}</p>`;
      fb += `<button class="primary wide" data-next>${Q.i + 1 < N ? u.nextQ : u.results}</button>`;
    }
    return `<div class="qtop"><button class="back" data-quit>${u.quit}</button><span class="qcount">${u.qn(Q.i + 1, N)}</span></div>
      <div class="qbar"><span style="width:${((Q.i + (done ? 1 : 0)) / N * 100).toFixed(0)}%"></span></div>
      <h1 class="qprompt">${prompt}</h1>${media}${opts}<div class="fb" aria-live="polite">${fb}</div>`;
  }
  function answer(i) {
    if (!Q || Q.picked !== null) return;
    const q = Q.items[Q.i], id = q.opts[i], x = st(q.id);
    const before = known(q.id);
    Q.picked = id;
    if (id === q.id) { Q.score++; x.r++; x.s++; }
    else { x.w++; x.s = 0; if (!Q.missed.includes(q.id)) Q.missed.push(q.id); if (x.k) x.k = false; }
    Q.justLearned = !before && known(q.id);
    if (Q.justLearned && !Q.learned.includes(q.id)) Q.learned.push(q.id);
    save(); render();
    const fb = $app.querySelector('.fb .primary');
    if (fb) { fb.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  function resultView() {
    const N = Q.items.length, s = Q.score, u = U();
    const msg = u.msg[s === N ? 0 : s >= N * 0.7 ? 1 : s >= N * 0.4 ? 2 : 3];
    let h = `<div class="bar"><button class="back" data-go="quiz">${u.pract}</button><span class="qcount">${setName(Q.key, Q.mode)}</span></div>
      <p class="score">${u.of(s, N)}</p><p class="scorep">${msg}</p>`;
    if (Q.learned.length) h += `<h2 class="sub">${u.newLearned}</h2><div class="chips">${Q.learned.map(chip).join('')}</div>`;
    if (Q.missed.length) h += `<h2 class="sub">${u.missed}</h2><ul class="rows">${Q.missed.map(id => row(byId[id])).join('')}</ul>`;
    h += `<div class="actions"><button class="primary wide" data-start="${Q.key}">${u.again}</button><button class="secondary wide" data-go="home">${u.toList[Q.mode]}</button></div>`;
    return h;
  }

  /* ---------- render ---------- */
  function render(top) {
    document.documentElement.lang = LANG;
    let h;
    if (view.name === 'tree') h = treeView(view.id);
    else if (view.name === 'quiz') h = Q ? (Q.done ? resultView() : questionView()) : quizSetupView();
    else h = homeView();
    $app.innerHTML = h;
    const tab = view.name === 'quiz' ? 'quiz' : 'home';
    $tabs.setAttribute('aria-label', U().menu);
    $tabs.querySelectorAll('button').forEach((b, i) => { b.textContent = U().tabs[MODE][i]; if (b.dataset.go === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (top) window.scrollTo(0, 0);
  }

  let homeScroll = 0;
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.reset === undefined && resetArmed) { resetArmed = false; }
    if (d.lang) { LANG = d.lang; try { localStorage.setItem(LANGKEY, LANG); } catch (er) { } render(); return; }
    if (d.mode) { if (d.mode !== MODE) { MODE = d.mode; Q = null; try { localStorage.setItem(MODEKEY, MODE); } catch (er) { } } render(true); return; }
    if (d.tree) { if (view.name === 'home') homeScroll = window.scrollY; view = { name: 'tree', id: d.tree }; render(true); return; }
    if (d.go) {
      if (d.go === 'quiz') { if (Q && Q.done) Q = null; view = { name: 'quiz' }; render(true); return; }
      const fromTree = view.name === 'tree';
      if (fromTree) { const m = plant(byId[view.id]) ? 'vaxt' : 'trad'; if (m !== MODE) { MODE = m; try { localStorage.setItem(MODEKEY, MODE); } catch (er) { } } }
      view = { name: 'home' }; render(); window.scrollTo(0, fromTree ? homeScroll : 0); return;
    }
    if (d.known) { const x = st(d.known); if (known(d.known)) { x.k = false; x.s = 0; } else { x.k = true; } save(); render(); return; }
    if (d.start) { startQuiz(d.start); return; }
    if (d.ans !== undefined) { answer(+d.ans); return; }
    if (d.next !== undefined) { if (Q.i + 1 < Q.items.length) { Q.i++; Q.picked = null; Q.justLearned = false; } else Q.done = true; render(true); return; }
    if (d.quit !== undefined) { Q = null; view = { name: 'quiz' }; render(true); return; }
    if (d.reset !== undefined) { if (resetArmed) { S = fresh(); resetArmed = false; save(); } else resetArmed = true; render(); return; }
  });

  render();
})();

</script>
</body>
</html>
